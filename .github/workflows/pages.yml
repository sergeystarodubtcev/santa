name: Тесты и деплой сайта на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Подставить адрес бэкенда и абсолютные ссылки для превью
        env:
          API_URL: ${{ vars.API_URL }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -n "$API_URL" ]; then
            node -e 'require("fs").writeFileSync("public/js/config.js", "window.SANTA_CONFIG = { apiUrl: " + JSON.stringify(process.env.API_URL) + " };\n")'
          fi
          sed -i "s#content=\"img/og.png\"#content=\"${BASE_URL}/img/og.png\"#" public/*.html
          cat public/js/config.js
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
