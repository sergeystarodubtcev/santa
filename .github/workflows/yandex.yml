name: Деплой в Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yandex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test
      - name: Деплой (бакет, функция, API Gateway)
        run: |
          if [ -z "$YC_SA_KEY" ]; then
            echo "::warning::Нет секрета YC_SA_KEY — деплой в Yandex Cloud пропущен. См. README, раздел «Yandex Cloud»."
            exit 0
          fi
          bash cloud/deploy.sh
