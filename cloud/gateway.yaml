# Спецификация Yandex API Gateway: статика сайта из приватного бакета + /api/* в облачную функцию.
# __BUCKET__, __SA__, __FN__ подставляет cloud/deploy.sh.
openapi: 3.0.0
info:
  title: kofesanta
  version: 1.0.0
paths:
  /:
    get:
      x-yc-apigateway-integration:
        type: object_storage
        bucket: __BUCKET__
        object: site/index.html
        service_account_id: __SA__
  /api/{proxy+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: proxy
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: __FN__
        service_account_id: __SA__
  /{file+}:
    get:
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: object_storage
        bucket: __BUCKET__
        object: site/{file}
        error_object: site/404.html
        service_account_id: __SA__
