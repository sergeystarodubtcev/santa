<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:Manrope,sans-serif;color:#f6e7d2;

.snow i{position:absolute;border-radius:50%;background:#fff}

h1{font:900 64px/1.08 Unbounded;margin:26px 0 22px;letter-spacing:-1px}
.g{background:linear-gradient(100deg,#ffd166,#d4a373 40%,#ff6b6b);-webkit-background-clip:text;color:transparent}
p{font-size:28px;color:#bda58d;margin:0}
p b{color:#f6e7d2}
.ava{position:absolute;right:90px;top:120px;width:320px;height:320px;border-radius:50%;background:#fff url(../public/img/logo.png) center/cover;box-shadow:0 0 0 8px #d4a373,0 30px 80px rgba(0,0,0,.6),0 0 120px rgba(212,163,115,.5)}
.e{position:absolute;font-size:64px}
</style></head><body>
<div class="snow" id="s"></div>
<div class="box"><div class="pill">☕ Кофеманьяки × 🎅 Тайный Санта</div>

<p>Регистрация открыта · отправка <b>1–10 декабря</b></p></div>
<div class="ava"></div>
<div class="e" style="right:60px;top:60px">🎁</div><div class="e" style="right:330px;top:470px">🎅</div><div class="e" style="right:40px;top:440px">❄️</div>
<script>for(let i=0;i<90;i++){const d=document.createElement('i');const r=Math.random()*4+1;d.style.cssText=`left:${Math.random()*1200}px;top:${Math.random()*630}px;width:${r}px;height:${r}px;opacity:${Math.random()*.6+.2}`;s.appendChild(d)}</script>
</body></html>
