# Blueprint для Render.com: New → Blueprint → выбрать этот репозиторий.
services:
  - type: web
    name: coffeemaniacs-santa
    runtime: node
    plan: free
    autoDeploy: true
    branch: main
    buildCommand: echo "no dependencies"
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ADMIN_PASSWORD
        sync: false          # задайте в дашборде Render
      - key: SECRET
        generateValue: true
      - key: GITHUB_DATA_REPO
        sync: false          # owner/santa-data — приватный репозиторий для базы
      - key: GITHUB_TOKEN
        sync: false          # fine-grained токен: Contents read/write на santa-data
